backend:
  name: github
  repo: bcoechicago/bcoe-website
  branch: main

publish_mode: simple

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "Events"
    label_singular: "Event"
    description: "Add and manage upcoming events. Events appear on the Events page automatically."
    folder: "content/events"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Event Title"
        name: "title"
        widget: "string"
        hint: "e.g. BCOE Annual Gala 2026"

      - label: "Event Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "MMMM D, YYYY"
        time_format: false
        hint: "Used to sort events and display the date badge."

      - label: "Time & Location"
        name: "meta"
        widget: "string"
        required: false
        hint: "e.g. 6:00 PM · Chicago, IL"

      - label: "Description"
        name: "description"
        widget: "text"
        hint: "2-3 sentences about the event."

      - label: "Button Text"
        name: "button_text"
        widget: "string"
        default: "Learn More"
        required: false

      - label: "Button Link"
        name: "button_link"
        widget: "string"
        required: false
        hint: "Ticket or registration URL. Leave blank to hide the button."

      - label: "Button Style"
        name: "button_style"
        widget: "select"
        options:
          - { label: "Gold", value: "gold" }
          - { label: "Dark", value: "dark" }
        default: "gold"

      - label: "Featured on Homepage"
        name: "featured"
        widget: "boolean"
        default: true

  - name: "flyers"
    label: "Event Flyers"
    label_singular: "Flyer"
    description: "Upload flyer images that scroll across the homepage banner."
    folder: "content/flyers"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - label: "Flyer Title"
        name: "title"
        widget: "string"
        hint: "Shown as a label under the flyer image on the homepage."

      - label: "Flyer Image"
        name: "image"
        widget: "image"
        hint: "Portrait/vertical image recommended. Best size: 440x600px."

      - label: "Link URL"
        name: "link"
        widget: "string"
        required: false
        default: "events.html"
        hint: "Where clicking the flyer goes. Default is the Events page."

      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Toggle off to hide from homepage without deleting."
