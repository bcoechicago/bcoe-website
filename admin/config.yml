backend:
  name: github
  repo: bcoechicago/bcoe-website
  branch: main

# Allows staff to log in via Netlify Identity
publish_mode: simple

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "Events"
    label_singular: "Event"
    description: "Manage upcoming events shown on the homepage and events page. The 3 most recent upcoming events display on the homepage automatically."
    folder: "content/events"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{month}}/{{day}}/{{year}}"
    sortable_fields: ["date", "title"]
    view_groups:
      - label: "By Month"
        field: date
        pattern: \d{4}-\d{2}
    fields:
      - label: "Event Title"
        name: "title"
        widget: "string"
        hint: "e.g. BCOE Annual Gala 2026"

      - label: "Event Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "MMMM D, YYYY"
        time_format: false
        hint: "Used to sort events and display the date badge."

      - label: "Display Time & Location"
        name: "meta"
        widget: "string"
        required: false
        hint: "e.g. 6:00 PM · Chicago, IL  — appears under the event title"

      - label: "Description"
        name: "description"
        widget: "text"
        hint: "2–3 sentences about the event."

      - label: "Button Text"
        name: "button_text"
        widget: "string"
        default: "Learn More →"
        required: false

      - label: "Button Link (URL)"
        name: "button_link"
        widget: "string"
        required: false
        hint: "Paste a MailChimp landing page, Eventbrite link, or any URL. Leave blank to hide the button."

      - label: "Button Style"
        name: "button_style"
        widget: "select"
        options:
          - { label: "Gold — for featured / ticketed events", value: "gold" }
          - { label: "Dark — for general / informational events", value: "dark" }
        default: "gold"

      - label: "Featured on Homepage"
        name: "featured"
        widget: "boolean"
        default: true
        hint: "Toggle off to hide this event from the homepage (it will still appear on the Events page)."
