backend:
  name: git-gateway
  branch: main

publish_mode: simple

media_folder: "uploads"
public_folder: "/uploads"

collections:

  # ── EVENTS ────────────────────────────────────────────────────────────────
  - name: "events"
    label: "Events"
    label_singular: "Event"
    description: "Add and manage upcoming events. Events appear on the Events page automatically."
    folder: "content/events"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Event Title"
        name: "title"
        widget: "string"
        hint: "e.g. BCOE Annual Gala 2026"

      - label: "Event Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "MMMM D, YYYY"
        time_format: false
        hint: "Used to sort events and display the date badge."

      - label: "Time & Location"
        name: "meta"
        widget: "string"
        required: false
        hint: "e.g. 6:00 PM · Chicago, IL"

      - label: "Description"
        name: "description"
        widget: "text"
        hint: "2-3 sentences about the event."

      - label: "Button Text"
        name: "button_text"
        widget: "string"
        default: "Learn More"
        required: false

      - label: "Button Link"
        name: "button_link"
        widget: "string"
        required: false
        hint: "Ticket or registration URL. Leave blank to hide the button."

      - label: "Button Style"
        name: "button_style"
        widget: "select"
        options:
          - { label: "Gold", value: "gold" }
          - { label: "Dark", value: "dark" }
        default: "gold"

      - label: "Featured on Homepage"
        name: "featured"
        widget: "boolean"
        default: true

  # ── EVENT FLYERS ──────────────────────────────────────────────────────────
  - name: "flyers"
    label: "Event Flyers"
    label_singular: "Flyer"
    description: "Upload flyer images that scroll across the homepage banner."
    folder: "content/flyers"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - label: "Flyer Title"
        name: "title"
        widget: "string"
        hint: "Shown as a label under the flyer image on the homepage."

      - label: "Flyer Image"
        name: "image"
        widget: "image"
        hint: "Portrait/vertical image recommended. Best size: 440x600px."

      - label: "Link URL"
        name: "link"
        widget: "string"
        required: false
        default: "events.html"
        hint: "Where clicking the flyer goes. Default is the Events page."

      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Toggle off to hide from homepage without deleting."

  # ── BOARD & OFFICERS ──────────────────────────────────────────────────────
  - name: "board"
    label: "Board & Officers"
    description: "Manage officers and board members shown on the About page."
    files:
      - label: "Board & Officers"
        name: "board"
        file: "content/board.json"
        fields:
          - label: "Officers"
            name: "officers"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }

          - label: "Board Members"
            name: "boardMembers"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }

  # ── COMMITTEES ────────────────────────────────────────────────────────────
  - name: "committees"
    label: "Committees"
    description: "Manage the committee listing shown on the About page."
    files:
      - label: "Committees"
        name: "committees"
        file: "content/committees.json"
        fields:
          - label: "Committees"
            name: "committees"
            widget: "list"
            fields:
              - { label: "Tag / Category", name: "tag", widget: "string", required: false }
              - { label: "Committee Name", name: "name", widget: "string" }
              - { label: "Chair", name: "chair", widget: "string" }
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
              - { label: "Description", name: "description", widget: "text", required: false }

  # ── NEWS ARTICLES ─────────────────────────────────────────────────────────
  - name: "news"
    label: "News Articles"
    description: "Manage news and updates shown on the News page."
    files:
      - label: "News Articles"
        name: "news"
        file: "content/news.json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            fields:
              - { label: "Emoji Icon", name: "emoji", widget: "string", required: false, hint: "e.g. 📋" }
              - { label: "Tag / Category", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Date", name: "date", widget: "string", hint: "e.g. June 2026 or Ongoing" }
              - { label: "Button Text", name: "linkText", widget: "string", default: "Read More →", required: false }
              - { label: "Link URL", name: "link", widget: "string", required: false, hint: "Full URL or page path. Use # if no link yet." }

  # ── SPONSORS ──────────────────────────────────────────────────────────────
  - name: "sponsors"
    label: "Sponsor Logos"
    description: "Add or remove sponsor logos shown across the site."
    files:
      - label: "Sponsor Logos"
        name: "sponsors"
        file: "content/sponsors.json"
        fields:
          - label: "Sponsors"
            name: "sponsors"
            widget: "list"
            fields:
              - { label: "Sponsor Name", name: "name", widget: "string" }
              - label: "Logo Image"
                name: "logo"
                widget: "image"

  # ── EVENT ADS / FLYERS (legacy) ───────────────────────────────────────────
  - name: "ads"
    label: "Event Ads (Legacy)"
    description: "Legacy event ad/flyer list. Use Event Flyers above for the homepage banner."
    files:
      - label: "Event Ads"
        name: "ads"
        file: "content/ads.json"
        fields:
          - label: "Ads"
            name: "ads"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - label: "Image"
                name: "image"
                widget: "image"
                required: false
              - { label: "Link URL", name: "link", widget: "string", required: false }

  # ── HOMEPAGE CONTENT ──────────────────────────────────────────────────────
  - name: "homepage"
    label: "Homepage Content"
    description: "Edit hero text, stats, about section, and contact info on the homepage."
    files:
      - label: "Homepage Content"
        name: "homepage"
        file: "content/homepage.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow Text", name: "eyebrow", widget: "string" }
              - { label: "Headline Line 1 (animated)", name: "headline_line1", widget: "string" }
              - { label: "Headline Line 2 (static)", name: "headline_line2_static", widget: "string" }
              - { label: "Headline Line 2 (animated)", name: "headline_line2", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "text" }
              - label: "Stats"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Number", name: "num", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Section Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Mission", name: "mission", widget: "text" }
              - { label: "Vision", name: "vision", widget: "text" }

          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }

  # ── JOIN PAGE ─────────────────────────────────────────────────────────────
  - name: "join-page"
    label: "Join Page"
    description: "Edit the hero text on the Join/Membership page."
    files:
      - label: "Join Page"
        name: "join-page"
        file: "content/join-page.json"
        fields:
          - { label: "Eyebrow Text", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subtext", name: "subtext", widget: "text" }
