<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — BCOE Chicago</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, sans-serif;
      background: #0D1117;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo { font-size: 13px; letter-spacing: 2px; color: #C9A84C; margin-bottom: 24px; text-transform: uppercase; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 28px; }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 16px;
    }
    input::placeholder { color: rgba(255,255,255,0.4); }
    button {
      width: 100%;
      padding: 13px;
      background: #C9A84C;
      color: #0D1117;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #d4b55e; }
    .msg { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .msg.error { color: #f87171; }
    .msg.success { color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">BCOE Chicago</div>
    <h1>Set New Password</h1>
    <p>Enter your new password below to complete your reset.</p>
    <input type="password" id="password" placeholder="New password" autocomplete="new-password"/>
    <input type="password" id="confirm" placeholder="Confirm new password" autocomplete="new-password"/>
    <button id="btn">Set Password</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Extract token from URL hash
    function getToken() {
      var hash = window.location.hash.substring(1);
      var params = {};
      hash.split('&').forEach(function(part) {
        var pair = part.split('=');
        params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
      });
      return params['recovery_token'] || params['invite_token'] || null;
    }

    var token = getToken();
    var msg = document.getElementById('msg');

    if (!token) {
      msg.textContent = 'No reset token found. Please request a new password reset.';
      msg.className = 'msg error';
      document.getElementById('btn').disabled = true;
    }

    document.getElementById('btn').addEventListener('click', function() {
      var pw = document.getElementById('password').value;
      var confirm = document.getElementById('confirm').value;

      if (!pw || pw.length < 8) {
        msg.textContent = 'Password must be at least 8 characters.';
        msg.className = 'msg error';
        return;
      }
      if (pw !== confirm) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'msg error';
        return;
      }

      msg.textContent = 'Setting password...';
      msg.className = 'msg';

      // Use Netlify Identity API directly with the recovery token
      fetch('/.netlify/identity/recover', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: pw })
      })
      .then(function(res) {
        if (res.ok) {
          msg.textContent = 'Password set! Redirecting to admin...';
          msg.className = 'msg success';
          setTimeout(function() { window.location.href = '/admin/'; }, 2000);
        } else {
          return res.json().then(function(data) {
            throw new Error(data.msg || 'Something went wrong.');
          });
        }
      })
      .catch(function(err) {
        // Fallback: open the Identity widget which handles the token natively
        msg.textContent = 'Opening password reset form...';
        msg.className = 'msg';
        if (window.netlifyIdentity) {
          window.netlifyIdentity.open();
        } else {
          msg.textContent = err.message;
          msg.className = 'msg error';
        }
      });
    });
  </script>
</body>
</html>
