<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BCOE Chicago — Admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D1117;
      font-family: 'Inter', sans-serif;
    }
    #bcoe-header {
      width: 100%;
      background: linear-gradient(180deg, #0a0d12 0%, #0D1117 100%);
      border-bottom: 1px solid rgba(201,168,76,0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 32px;
      position: relative;
      overflow: hidden;
    }
    #bcoe-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    #bcoe-header img {
      width: 200px;
      height: auto;
      display: block;
      position: relative;
    }
    #bcoe-header .tagline {
      font-family: 'Cinzel', serif;
      font-size: 9.5px;
      letter-spacing: 3.5px;
      color: rgba(201,168,76,0.65);
      text-transform: uppercase;
      margin-top: 16px;
      position: relative;
    }
    #bcoe-header .rule {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      width: 180px;
      position: relative;
    }
    #bcoe-header .rule span {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.65), transparent);
    }
    #bcoe-header .rule em {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #C9A84C;
      flex-shrink: 0;
      font-style: normal;
    }
  </style>
